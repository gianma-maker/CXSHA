<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyempre Lyrics</title>

    <!-- Website icon (same folder as this file) -->
    <link rel="icon" type="image/jpeg" href="couples.jpg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

    <!-- CSS file -->
    <link rel="stylesheet" href="lyrics.css">
</head>

<body>

    <main class="music-card">

        <h1>Siyempre</h1>
        <p class="artist">Song by Gian Ma</p>

        <!-- Album cover with YouTube link -->
        <a href="https://www.youtube.com/watch?v=IDlLgylE6WM&list=RDIDlLgylE6WM&start_radio=1"
           target="_blank"
           rel="noopener noreferrer">
            <img src="couples.jpg"
                 alt="Album art cover"
                 title="Watch the original song"
                 class="album-cover">
        </a>

        <p class="description">
            A song about love, promises, and choosing someone every day.
        </p>

        <hr>

        <!-- Hide / show lyrics button -->
        <button id="toggleLyrics" type="button" aria-expanded="true" aria-controls="lyrics">
            Hide Lyrics
        </button>

        <!-- Lyrics section -->
        <section id="lyrics" class="lyrics" aria-label="Song lyrics">
<pre>PASTE YOUR LYRICS HERE.
Keep each line on its own line.
Leave a blank line between verses.</pre>
        </section>

        <footer>
            <p>Made by Gian Ma &hearts;</p>
        </footer>

    </main>

    <!-- JavaScript file -->
    <script src="lyrics.js"></script>

</body>
</html>
